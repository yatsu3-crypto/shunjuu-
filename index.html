<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>春秋スクラップ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif; background: #f7f2e8; color: #2c2416; min-height: 100vh; }

header { background: #1a1208; color: #f0e6cc; padding: 0.9rem 1.2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 1.15rem; letter-spacing: 0.25em; }
header small { font-size: 0.72rem; opacity: 0.55; }

.tabs { display: flex; background: #2c2416; }
.tab { flex: 1; padding: 0.75rem 0; text-align: center; color: #a09070; cursor: pointer; font-size: 0.88rem; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab.active { color: #f0e6cc; border-bottom-color: #c8a96e; }

.view { display: none; }
.view.active { display: block; }

/* 一覧 */
#view-list { padding: 1rem; }
.empty { text-align: center; padding: 3rem 1rem; color: #a09070; line-height: 2.4; font-size: 0.95rem; }
.card { background: #fff; border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 0.75rem; border-left: 4px solid #c8a96e; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.card:active { opacity: 0.75; }
.card-info h3 { font-size: 1rem; margin-bottom: 0.2rem; }
.card-info span { font-size: 0.78rem; color: #a09070; }
.del-btn { background: none; border: 1px solid #ddd; border-radius: 6px; padding: 0.35rem 0.7rem; font-size: 0.78rem; color: #999; cursor: pointer; font-family: inherit; flex-shrink: 0; margin-left: 0.5rem; }

/* 追加 */
#view-add { padding: 1rem 1rem 3rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.82rem; color: #7a6a52; margin-bottom: 0.35rem; }
.field input, .field textarea { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #d4c4a8; border-radius: 8px; font-family: inherit; font-size: 1rem; background: #fff; -webkit-appearance: none; }
.field textarea { height: 300px; resize: vertical; line-height: 1.9; }
.field input:focus, .field textarea:focus { outline: none; border-color: #c8a96e; }
.save-btn { width: 100%; padding: 0.9rem; border-radius: 10px; border: none; background: #1a1208; color: #f0e6cc; font-family: inherit; font-size: 1rem; letter-spacing: 0.1em; cursor: pointer; }
.save-btn:active { background: #3d3020; }

/* 読む */
#view-read { padding: 1rem 1rem 4rem; }
.back-btn { color: #c8a96e; font-size: 0.88rem; cursor: pointer; margin-bottom: 1rem; display: inline-block; }
#read-title { font-size: 1.5rem; letter-spacing: 0.2em; margin-bottom: 0.25rem; }
#read-date { font-size: 0.82rem; color: #a09070; margin-bottom: 1.5rem; }
.article { background: #fff; border-radius: 10px; padding: 1.5rem 1.3rem; font-size: 1.08rem; line-height: 2.4; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.article p { margin-bottom: 1em; text-indent: 1em; }
.article p.no-indent { text-indent: 0; }

.migrate-banner { background: #edfaf2; border: 1px solid #7dd4a0; border-radius: 8px; padding: 0.7rem 1rem; margin-bottom: 1rem; font-size: 0.82rem; color: #2a6a3a; }
</style>
</head>
<body>

<header>
  <h1>春秋スクラップ</h1>
  <small>日経コラム帳</small>
</header>

<div class="tabs">
  <div class="tab active" data-tab="list" onclick="showTab('list')">📚 一覧</div>
  <div class="tab" data-tab="add" onclick="showTab('add')">✏️ 追加</div>
</div>

<!-- 一覧 -->
<div id="view-list" class="view active">
  <div id="migrate-banner"></div>
  <div id="list-inner"></div>
</div>

<!-- 追加 -->
<div id="view-add" class="view">
  <div class="field">
    <label>日付</label>
    <input type="date" id="in-date">
  </div>
  <div class="field">
    <label>タイトル</label>
    <input type="text" id="in-title" value="春秋">
  </div>
  <div class="field">
    <label>本文を貼り付け</label>
    <textarea id="in-body" placeholder="春秋の本文をここに貼り付けてください"></textarea>
  </div>
  <button class="save-btn" onclick="doSave()">💾 保存する</button>
</div>

<!-- 読む -->
<div id="view-read" class="view">
  <div class="back-btn" onclick="showTab('list')">← 一覧に戻る</div>
  <div id="read-title"></div>
  <div id="read-date"></div>
  <div class="article" id="read-body"></div>
</div>

<script>
const KEY = 'shunjuu_simple';
// 旧バージョンのキー一覧
const OLD_KEYS = ['shunjuu_v4', 'shunjuu_v3', 'shunjuu_v2'];

function loadData() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function saveData(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

// 旧データを統合して移行
function migrateOldData() {
  const current = loadData();
  const currentDates = new Set(current.map(d => d.date + '_' + d.title));
  let migrated = 0;

  OLD_KEYS.forEach(oldKey => {
    try {
      const old = JSON.parse(localStorage.getItem(oldKey)) || [];
      old.forEach(entry => {
        const key = entry.date + '_' + entry.title;
        if (!currentDates.has(key)) {
          // 旧データはbodyまたはrubyBodyから本文を取得
          const body = entry.body || entry.rubyBody || '';
          // rubyタグを除去してプレーンテキストに
          const plainBody = body.replace(/<ruby>/g,'').replace(/<rt>[^<]*<\/rt>/g,'').replace(/<\/ruby>/g,'').replace(/<[^>]+>/g,'');
          current.push({
            date: entry.date || '',
            title: entry.title || '春秋',
            body: plainBody,
            saved: entry.saved || new Date().toISOString()
          });
          currentDates.add(key);
          migrated++;
        }
      });
    } catch(e) {}
  });

  if (migrated > 0) {
    // 日付順にソート
    current.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveData(current);
    return migrated;
  }
  return 0;
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'list') renderList();
  if (name === 'add') resetForm();
}

function renderList() {
  const data = loadData();
  const el = document.getElementById('list-inner');
  if (!data.length) {
    el.innerHTML = '<div class="empty">📰<br>まだスクラップがありません<br>「追加」タブから貼り付けてください</div>';
    return;
  }
  el.innerHTML = data.slice().reverse().map((d, ri) => {
    const i = data.length - 1 - ri;
    return `<div class="card" onclick="openEntry(${i})">
      <div class="card-info">
        <h3>${esc(d.title)}</h3>
        <span>${d.date || '日付なし'}</span>
      </div>
      <button class="del-btn" onclick="event.stopPropagation();delEntry(${i})">削除</button>
    </div>`;
  }).join('');
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function delEntry(i) {
  if (!confirm('削除しますか？')) return;
  const data = loadData(); data.splice(i,1); saveData(data); renderList();
}

function openEntry(i) {
  const d = loadData()[i];
  document.getElementById('read-title').textContent = d.title || '無題';
  document.getElementById('read-date').textContent = d.date || '';
  document.getElementById('read-body').innerHTML = renderBody(d.body || '');
  showTab('read');
}

function renderBody(text) {
  return text.split(/\n\n+/).map(p => {
    p = p.trim(); if (!p) return '';
    const cls = p.startsWith('▼') ? 'no-indent' : '';
    return `<p class="${cls}">${esc(p)}</p>`;
  }).join('');
}

function resetForm() {
  document.getElementById('in-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('in-title').value = '春秋';
  document.getElementById('in-body').value = '';
}

function doSave() {
  const date  = document.getElementById('in-date').value;
  const title = document.getElementById('in-title').value.trim() || '春秋';
  const body  = document.getElementById('in-body').value.trim();
  if (!body) { alert('本文を貼り付けてください'); return; }
  const data = loadData();
  data.push({ date, title, body, saved: new Date().toISOString() });
  // 日付順にソート
  data.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  saveData(data);
  alert('保存しました！');
  showTab('list');
}

// 起動時に旧データを移行
const migrated = migrateOldData();
if (migrated > 0) {
  const banner = document.getElementById('migrate-banner');
  banner.className = 'migrate-banner';
  banner.textContent = `✅ 旧データ ${migrated} 件を引き継ぎました`;
  setTimeout(() => banner.style.display = 'none', 4000);
}

renderList();
document.getElementById('in-date').value = new Date().toISOString().slice(0,10);
</script>
</body>
</html>
